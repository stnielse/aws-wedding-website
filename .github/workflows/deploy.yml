# Continuous deploy for the wedding-site repo (Session 15).
#
# Fires on push to main. Also exposes workflow_dispatch so we can
# redeploy without a code change (e.g., after rotating a secret in
# SSM and needing a gunicorn restart).
#
# Two-job pipeline:
#
#   ci      Reuses .github/workflows/ci.yml via workflow_call, with
#           upload_artifact: true so the frontend job also uploads
#           its built backend/static/frontend tree as a GHA artifact
#           ("frontend-dist"). Deploy is gated on this -- a green
#           push cannot ship a broken tree, and there's exactly one
#           `pnpm build` per deploy across the whole pipeline.
#
#   deploy  Downloads the frontend-dist artifact, tars it, uploads
#           to s3://<static-bucket>/deploy/frontend-<sha>.tar.gz,
#           then fires SSM SendCommand against the wedding-site EC2
#           instance to run scripts/deploy.sh with the git sha + S3
#           URL. Polls GetCommandInvocation until terminal; fails
#           the workflow on anything other than Success.
#
# Uses OIDC to assume the deploy role -- no long-lived AWS keys
# anywhere in this file. Trust policy in infra/phase3/oidc.tf
# restricts assumption to this repo's main branch.
#
# Required repo variables (Settings -> Secrets and variables ->
# Actions -> Variables):
#   AWS_DEPLOY_ROLE_ARN  ARN of the github-deploy IAM role (output
#                        of infra/phase3: github_deploy_role_arn).
#   STATIC_BUCKET_NAME   Name of the static bucket (infra/phase3
#                        output: static_bucket_name).
#   EC2_INSTANCE_ID      Instance ID of the web tier (infra/phase3
#                        output: ec2_instance_id).
#
# Actions pinned to exact release tags per [[feedback-strict-version-pins]].

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel an in-flight deploy.

permissions:
  id-token: write   # Required for aws-actions/configure-aws-credentials OIDC.
  contents: read

jobs:
  ci:
    name: ci
    uses: ./.github/workflows/ci.yml
    with:
      upload_artifact: true

  deploy:
    name: deploy
    needs: [ci]
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Package build output
        # ci.yml uploaded the whole backend/static/frontend tree
        # under frontend-dist/. Tar contents go straight into that
        # same directory on the instance (scripts/deploy.sh extracts
        # with -C backend/static/frontend).
        run: |
          cd frontend-dist
          tar -czf "$RUNNER_TEMP/frontend.tar.gz" .
          ls -lh "$RUNNER_TEMP/frontend.tar.gz"

      - name: Assume AWS deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload tarball to S3
        env:
          BUCKET: ${{ vars.STATIC_BUCKET_NAME }}
          SHA: ${{ github.sha }}
        run: |
          aws s3 cp \
              "$RUNNER_TEMP/frontend.tar.gz" \
              "s3://$BUCKET/deploy/frontend-$SHA.tar.gz"

      - name: Trigger SSM RunCommand (deploy.sh on the instance)
        id: send
        env:
          BUCKET: ${{ vars.STATIC_BUCKET_NAME }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          # SSM SendCommand only accepts JSON for the shell body.
          # Build it with jq so the SHA + artifact URL are quoted
          # safely -- never string-interpolate untrusted input into
          # a raw JSON blob.
          COMMAND_BODY=$(jq -n \
            --arg cmd "sudo -u ec2-user /home/ec2-user/aws-wedding-website/scripts/deploy.sh $SHA s3://$BUCKET/deploy/frontend-$SHA.tar.gz" \
            '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "wedding-site deploy $SHA" \
              --parameters "$COMMAND_BODY" \
              --query 'Command.CommandId' \
              --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command: $command_id"

      - name: Wait for deploy.sh to finish + surface output
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          # aws ssm wait command-executed polls up to 10 minutes with
          # a 5-second backoff. deploy.sh should finish inside 60
          # seconds in the steady state. Exit code non-zero if the
          # invocation reaches Failed / TimedOut / Cancelled.
          set +e
          aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
          wait_status=$?
          set -e

          # Always surface the invocation output, whether the wait
          # succeeded or not -- gives us diagnostic context in the
          # workflow log on failure.
          aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json \
            | jq -r '
                "status: \(.Status)",
                "----- stdout -----",
                .StandardOutputContent,
                "----- stderr -----",
                .StandardErrorContent
              '

          exit "$wait_status"
