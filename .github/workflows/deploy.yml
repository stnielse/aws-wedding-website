# Continuous deploy for the wedding-site repo (Session 15).
#
# Fires on push to main. Also exposes workflow_dispatch so we can
# redeploy without a code change (e.g., after rotating a secret in
# SSM and needing a gunicorn restart).
#
# Four jobs:
#
#   python    Re-runs Django tests + ruff against the head SHA on
#             main so a green push cannot ship a broken tree. Same
#             steps as pr-checks.yml's python job; keep them in
#             sync.
#   frontend  Node 22 + pnpm build; uploads
#             backend/static/frontend/ as a GHA artifact
#             (frontend-dist) for the deploy job to download.
#             Duplicates pr-checks.yml's frontend job plus the
#             upload step.
#   deploy    needs [python, frontend]. Downloads frontend-dist,
#             tars it, uploads to
#             s3://<static-bucket>/deploy/frontend-<sha>.tar.gz,
#             then fires SSM SendCommand against the wedding-site
#             EC2 instance to run scripts/deploy.sh with the git
#             sha + S3 URL. Polls GetCommandInvocation until
#             terminal; fails on anything other than Success.
#
# Single `on:` trigger set (push:main + workflow_dispatch) so
# check-run names don't get an event suffix. This mirrors why
# pr-checks.yml is separate -- see that file's header for the full
# story on why the split exists.
#
# Uses OIDC to assume the deploy role -- no long-lived AWS keys
# anywhere in this file. Trust policy in infra/phase3/oidc.tf
# restricts assumption to this repo's main branch.
#
# Required repo variables (Settings -> Secrets and variables ->
# Actions -> Variables):
#   AWS_DEPLOY_ROLE_ARN  ARN of the github-deploy IAM role (output
#                        of infra/phase3: github_deploy_role_arn).
#   STATIC_BUCKET_NAME   Name of the static bucket (infra/phase3
#                        output: static_bucket_name).
#   EC2_INSTANCE_ID      Instance ID of the web tier (infra/phase3
#                        output: ec2_instance_id).
#
# Actions pinned to exact release tags per [[feedback-strict-version-pins]].

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Never cancel an in-flight deploy.

permissions:
  id-token: write   # Required for aws-actions/configure-aws-credentials OIDC.
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/production.txt
            backend/requirements/local.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r backend/requirements/production.txt \
            -r backend/requirements/local.txt

      - name: Ruff check
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Django tests
        working-directory: backend
        run: python manage.py test --verbosity=2

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Enable corepack (pnpm 11.17.0 pinned in package.json)
        run: corepack enable

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Upload build artifact for deploy job
        uses: actions/upload-artifact@v4.4.3
        with:
          name: frontend-dist
          path: backend/static/frontend/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy
    needs: [python, frontend]
    runs-on: ubuntu-24.04
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Download frontend build artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: frontend-dist
          path: frontend-dist/

      - name: Package build output
        # The frontend job uploaded the whole backend/static/frontend
        # tree under frontend-dist/. Tar contents go straight into
        # that same directory on the instance (scripts/deploy.sh
        # extracts with -C backend/static/frontend).
        run: |
          cd frontend-dist
          tar -czf "$RUNNER_TEMP/frontend.tar.gz" .
          ls -lh "$RUNNER_TEMP/frontend.tar.gz"

      - name: Assume AWS deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload tarball to S3
        env:
          BUCKET: ${{ vars.STATIC_BUCKET_NAME }}
          SHA: ${{ github.sha }}
        run: |
          aws s3 cp \
              "$RUNNER_TEMP/frontend.tar.gz" \
              "s3://$BUCKET/deploy/frontend-$SHA.tar.gz"

      - name: Trigger SSM RunCommand (deploy.sh on the instance)
        id: send
        env:
          BUCKET: ${{ vars.STATIC_BUCKET_NAME }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          # SSM SendCommand only accepts JSON for the shell body.
          # Build it with jq so the SHA + artifact URL are quoted
          # safely -- never string-interpolate untrusted input into
          # a raw JSON blob.
          COMMAND_BODY=$(jq -n \
            --arg cmd "sudo -u ec2-user /home/ec2-user/aws-wedding-website/scripts/deploy.sh $SHA s3://$BUCKET/deploy/frontend-$SHA.tar.gz" \
            '{commands: [$cmd]}')
          command_id=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name AWS-RunShellScript \
              --comment "wedding-site deploy $SHA" \
              --parameters "$COMMAND_BODY" \
              --query 'Command.CommandId' \
              --output text)
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command: $command_id"

      - name: Wait for deploy.sh to finish + surface output
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
        run: |
          # aws ssm wait command-executed polls up to 10 minutes with
          # a 5-second backoff. deploy.sh should finish inside 60
          # seconds in the steady state. Exit code non-zero if the
          # invocation reaches Failed / TimedOut / Cancelled.
          set +e
          aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID"
          wait_status=$?
          set -e

          # Always surface the invocation output, whether the wait
          # succeeded or not -- gives us diagnostic context in the
          # workflow log on failure.
          aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json \
            | jq -r '
                "status: \(.Status)",
                "----- stdout -----",
                .StandardOutputContent,
                "----- stderr -----",
                .StandardErrorContent
              '

          exit "$wait_status"
