# Continuous integration for the wedding-site repo.
#
# Two parallel jobs. `python` runs ruff + Django's test runner against
# the local settings module. `frontend` runs oxlint (aliased to
# `pnpm lint` in frontend/package.json) and a full production build to
# catch any Vite/rollup-time regressions.
#
# Also exposed as a reusable workflow (`workflow_call`) so
# `deploy.yml` can rerun lint + tests before touching the instance
# without duplicating the job definitions here.
#
# Node 22 (not 20) because frontend/package.json pins pnpm@11.17.0
# and pnpm 11 requires Node >= 22.13. Matches the AL2023 install in
# infra/phase3/templates/user_data.sh.tftpl.
#
# Actions pinned to exact release tags per [[feedback-strict-version-pins]].

name: ci

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      upload_artifact:
        description: >-
          When true, the frontend job also uploads the built
          backend/static/frontend/ tree as a GitHub Actions artifact
          named "frontend-dist". deploy.yml sets this true so it can
          download the artifact and ship to S3 without rebuilding.
        type: boolean
        default: false
        required: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Python 3.12
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements/base.txt
            backend/requirements/production.txt
            backend/requirements/local.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r backend/requirements/production.txt \
            -r backend/requirements/local.txt

      - name: Ruff check
        run: ruff check backend/

      - name: Ruff format check
        run: ruff format --check backend/

      - name: Django tests
        working-directory: backend
        run: python manage.py test --verbosity=2

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node 22
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'

      - name: Enable corepack (pnpm 11.17.0 pinned in package.json)
        run: corepack enable

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Build
        working-directory: frontend
        run: pnpm build

      - name: Upload build artifact for downstream deploy
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: frontend-dist
          path: backend/static/frontend/
          if-no-files-found: error
          retention-days: 7
